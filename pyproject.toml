[project]
name = "jagadish-multi-agent-orchestration"
version = "0.1.0"
description = "Multi-agent orchestration patterns as code: supervisor, router, sequential, blackboard, and hierarchical — fully offline with a deterministic fake LLM."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jagadish" }]
keywords = ["agents", "orchestration", "llm", "multi-agent"]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "scenarios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
