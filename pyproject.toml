[project]
name = "jagadish-multi-agent-orchestration"
version = "0.1.0"
description = "Multi-agent orchestration patterns as code, plus CrewAI, LangGraph, and Agent Framework on one research task, and plan-and-execute vs ReWOO vs ReAct. Offline mock by default; Azure OpenAI when configured."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jagadish" }]
keywords = ["agents", "orchestration", "llm", "multi-agent"]
dependencies = []

[project.optional-dependencies]
frameworks = [
    "langgraph>=1.0,<2",
    "crewai>=1.6,<2",
    "agent-framework>=1.22,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "scenarios"]

[tool.hatch.build.targets.wheel.force-include]
"evals/golden_research.json" = "orchestrator/frameworks/golden_research.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]
